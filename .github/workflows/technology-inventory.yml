name: Technology inventory review

on:
  pull_request:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Verify release evidence behavior
        run: python .github/scripts/test_technology_inventory.py
      - name: Check inventory review age
        run: python .github/scripts/check-technology-inventory.py --max-age-days 90
